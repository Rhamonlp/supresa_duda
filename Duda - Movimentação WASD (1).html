<title>Duda - Movimentação WASD</title>
<style>
:root{--bg:#f3efe8;--fg:#2b2622;--floor:#d9cfbd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a17;--fg:#ece6dc;--floor:#332f2a}}
:root[data-theme="dark"]{--bg:#1d1a17;--fg:#ece6dc;--floor:#332f2a}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;text-align:center}
h1{font-size:1.1rem;margin:14px 0 6px}
canvas{display:block;margin:8px auto;max-width:100%;background:var(--floor);image-rendering:pixelated;border-radius:8px}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin:10px auto}
.pad button{height:56px;font-size:1.2rem;border-radius:10px;border:1px solid var(--fg);background:transparent;color:var(--fg);touch-action:none}
.pad button.on{background:var(--fg);color:var(--bg)}
p{font-size:.85rem;opacity:.8;margin:4px}

let loaded=0;duda.onload=amon.onload=()=>{if(++loaded==2)loop()};
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
const COLS=4,SCALE=4,SPEED=2.2,ROW={down:0,idle:1,right:2,up:3,left:4};
const HOME={x:570,y:92},NOTICE=210,START=120,GAP=54;
const keys={},order=[];
let x=200,y=300,dir="down",t=0,ax=HOME.x,ay=HOME.y,mode="free",timer=0,armed=true,s=-1,tD=null,tA=null;
function press(k,on){if(!"wasd".includes(k))return;keys[k]=on;const i=order.indexOf(k);if(i>-1)order.splice(i,1);if(on)order.push(k);
document.querySelectorAll(".pad button").forEach(b=>b.classList.toggle("on",!!keys[b.dataset.k]))}
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if("wasd".includes(k)){e.preventDefault();press(k,true)}});
addEventListener("keyup",e=>press(e.key.toLowerCase(),false));
addEventListener("blur",()=>"wasd".split("").forEach(k=>press(k,false)));
document.querySelectorAll(".pad button").forEach(b=>{const k=b.dataset.k;
b.addEventListener("pointerdown",e=>{e.preventDefault();press(k,true)});
["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>press(k,false)))});
const D={w:["up",0,-1],s:["down",0,1],a:["left",-1,0],d:["right",1,0]};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function step(p,q,sp){const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<=sp){p.x=q.x;p.y=q.y;return true}p.x+=dx/d*sp;p.y+=dy/d*sp;return false}
const HEART=["0110110","1111111","1111111","0111110","0011100","0001000"];
function heart(cx,cy,sc){ctx.fillStyle="#e0485f";HEART.forEach((r,j)=>[...r].forEach((v,i)=>{if(v=="1")ctx.fillRect(Math.round(cx+(i-3.5)*sc),Math.round(cy+j*sc),sc,sc)}))}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const bg=document.createElement("canvas");bg.width=640;bg.height=400;
(function(){const g=bg.getContext("2d");
const R=(c,a,b,w,h)=>{g.fillStyle=c;g.fillRect(a,b,w,h)};
const blob=(cx,cy,r,c)=>{g.fillStyle=c;for(let i=-r;i<=r;i+=4)for(let j=-r;j<=r;j+=4)if(i*i+j*j<=r*r)g.fillRect(cx+i,cy+j,4,4)};
const ell=(cx,cy,rx,ry,c)=>{g.fillStyle=c;for(let i=-rx;i<=rx;i+=4)for(let j=-ry;j<=ry;j+=4)if((i/rx)**2+(j/ry)**2<=1)g.fillRect(cx+i,cy+j,4,4)};
for(let i=0;i<20;i++)for(let j=0;j<13;j++)R((i+j)%2?"#7cc46a":"#86cc72",i*32,j*32,32,32);
for(let n=0;n<120;n++){const a=Math.floor(rnd()*160)*4,b=Math.floor(rnd()*100)*4;R("#5fa95a",a,b,4,4);R("#5fa95a",a+4,b-4,4,8)}
const segs=[[0,236,548,48],[500,140,48,144]];
segs.forEach(([a,b,w,h])=>R("#d2bb86",a-4,b-4,w+8,h+8));
segs.forEach(([a,b,w,h])=>R("#ead7a6",a,b,w,h));
for(let n=0;n<30;n++){const a=Math.floor(rnd()*130)*4,b=244+Math.floor(rnd()*10)*4;R("#c9b88a",a,b,4,4)}
ell(120,95,76,46,"#d9c79a");ell(120,95,68,40,"#4a86b8");ell(120,95,62,34,"#6bb4e0");
R("#9fd4f0",80,80,24,4);R("#9fd4f0",132,104,32,4);R("#9fd4f0",100,116,16,4);
blob(156,84,8,"#4f9d57");R("#f8a5c4",152,80,8,8);blob(92,108,8,"#4f9d57");
const ok=(a,b)=>!segs.some(([x0,y0,w,h])=>a>x0-12&&a<x0+w+12&&b>y0-12&&b<y0+h+12)&&(((a-120)/84)**2+((b-95)/54)**2>1);
const FC=["#ffffff","#ffd0e0","#fff1a0","#c9b6ff"];
for(let n=0;n<90;n++){const a=Math.floor(rnd()*155)*4,b=Math.floor(rnd()*90)*4;if(!ok(a,b))continue;const c=FC[n%4];R("#4f9d57",a+2,b+4,2,4);R(c,a,b,6,2);R(c,a+2,b-2,2,6);R("#f2c14e",a+2,b,2,2)}

const petals=Array.from({length:28},()=>({x:Math.random()*640,y:Math.random()*400,v:.4+Math.random()*.5,ph:Math.random()*6}));
function loop(){
t++;const fw=duda.width/COLS,fh=duda.height/5,w=fw*SCALE,h=fh*SCALE;
let moving=false;

  let dx=0,dy=0;for(const k of "wasd")if(keys[k]){dx+=D[k][1];dy+=D[k][2]}

  let row,frame;

  else if(turned){row=ROW[mode=="free"?(x<ax?"right":"left"):dir];frame=0}
  else{row=ROW.idle;frame=Math.floor(t/20)%COLS}
  ctx.drawImage(duda,frame*fw,row*fh,fw,fh,Math.round(x-w/2),Math.round(y-h/2),w,h)};

  const aw=amon.width/4,ah=amon.height/2;
  ctx.save();ctx.translate(Math.round(ax),Math.round(ay));
  if(turned){if(faceLeft)ctx.scale(-1,1);ctx.drawImage(amon,0,ah,aw,ah,-aw*SCALE/2,-ah*SCALE/2,aw*SCALE,ah*SCALE)}
  else ctx.drawImage(amon,(Math.floor(t/20)%4)*aw,0,aw,ah,-aw*SCALE/2,-ah*SCALE/2,aw*SCALE,ah*SCALE);
  ctx.restore()};

ctx.fillStyle="#f8bcd4";petals.forEach(p=>{p.y+=p.v;p.x+=.3+Math.sin(t/30+p.ph)*.4;if(p.y>404){p.y=-6;p.x=Math.random()*640}ctx.fillRect(Math.round(p.x),Math.round(p.y),4,3)});

ctx.fillStyle="#e0485f";ctx.fillRect(120,268,76,22);
ctx.textBaseline="top";ctx.font="bold 15px monospace";ctx.fillStyle="#fffaf0";ctx.fillText("Amon",134,272);
ctx.font="bold 18px monospace";ctx.fillStyle="#4a3b3b";
ctx.fillText(L[0].slice(0,n),136,302);ctx.fillText(L[1].slice(0,Math.max(0,n-L[0].length)),136,326);
if(n>=L[0].length)heart(330,303,3)}
if(mode=="kiss"){const mx=(x+ax)/2;for(let i=0;i<3;i++){const p=((timer+i*40)%120)/120;
  heart(mx+(i-1)*14+Math.sin(p*6+i)*6,ay-30-p*50,2+(i==1?1:0))}}
requestAnimationFrame(loop)}
